name: Keep-alive

# Pings the live demo so the HF Space doesn't sleep. /api/documents is a
# read-only query and does not count as activity for Supabase's inactivity
# pause, so a separate step writes and deletes a row directly to keep the
# database awake too.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo
        run: |
          curl -fsS --max-time 60 --retry 3 --retry-delay 15 \
            https://josegm61-arxiv-rag.hf.space/api/documents > /dev/null \
            && echo "Demo is awake" \
            || echo "Ping failed (Space may be cold-starting)"

      - name: Keep Supabase database alive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -c "create table if not exists _keepalive (id serial primary key, pinged_at timestamptz default now());"
          psql "$DATABASE_URL" -c "insert into _keepalive (pinged_at) values (now());"
          psql "$DATABASE_URL" -c "delete from _keepalive where pinged_at < now() - interval '1 day';"
