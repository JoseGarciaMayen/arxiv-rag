services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: arxiv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rag -d arxiv" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://rag:rag@db:5432/arxiv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: frontend
    ports:
      - "3000:80"
    environment:
      PORT: "80"
      API_URL: "http://api:8000"
    depends_on:
      - api

volumes:
  pgdata:
