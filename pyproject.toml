[project]
name = "arxiv-rag"
version = "0.1.0"
description = "RAG system for academic papers using pgvector and Groq"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pymupdf",
    "langchain-text-splitters",
    "sentence-transformers",
    "psycopg2-binary",
    "pgvector",
    "sqlalchemy",
    "groq",
    "python-dotenv",
]