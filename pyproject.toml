[project]
name = "arxiv-rag"
version = "0.1.0"
description = "RAG system for academic papers using pgvector and Groq"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pymupdf",
    "langchain-text-splitters",
    "sentence-transformers",
    "psycopg2-binary",
    "pgvector",
    "sqlalchemy",
    "groq",
    "python-dotenv",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "ragas==0.2.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses File(...), Query(...), etc. as argument defaults
